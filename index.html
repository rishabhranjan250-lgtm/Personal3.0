<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Months of Us 💗</title>
<style>
:root{--site-primary:#b52c68;--site-secondary:#f9dce8;--site-background:#fff5f8;--site-on-primary:#fff;--site-on-secondary:#64213f;--site-on-background:#4b2435;--site-font-body:system-ui,-apple-system,"Segoe UI",sans-serif;--site-font-heading:Georgia,"Times New Roman",serif;--site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;font-family:var(--site-font-body);color:light-dark(#4b2435,#ffeaf2);background:var(--site-background)}
#app{min-height:100vh;background-color:light-dark(#fff5f8,#24131d);color:light-dark(#4b2435,#ffeaf2);position:relative;overflow:hidden}
.decor{position:fixed;inset:0;pointer-events:none;opacity:var(--site-decoration-opacity);overflow:hidden;z-index:0}.float{position:absolute;bottom:-50px;font-size:22px;animation:rise linear infinite;opacity:.32}@keyframes rise{to{transform:translateY(-115vh) rotate(35deg);opacity:0}}
main{position:relative;z-index:1;max-width:760px;margin:auto;padding:24px 18px 60px}.top{text-align:center;padding:10px 0 18px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;color:var(--site-primary);font-weight:800}.progress{height:5px;border-radius:20px;background:#f2c7d8;overflow:hidden;margin:18px auto 0;max-width:260px}.progress span{display:block;height:100%;width:0;background:var(--site-primary);transition:width .4s}.card{background:light-dark(#fff,#321c29);border:1px solid light-dark(#f2d4e0,#583348);border-radius:calc(24px * var(--site-radius-scale));padding:clamp(22px,5vw,42px);box-shadow:0 18px 55px #7b244019;min-height:440px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;animation:enter .45s ease}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}h1,h2{font-family:var(--site-font-heading);font-weight:600;line-height:1.15}h1{font-size:calc(clamp(2.3rem,8vw,4rem) * var(--site-heading-scale));margin:12px 0}h2{font-size:calc(clamp(1.8rem,5vw,2.6rem) * var(--site-heading-scale));margin:12px 0 18px}.sub{font-size:1.06rem;line-height:1.8;max-width:570px}.heart{font-size:64px;display:inline-block;animation:beat 1.15s infinite}@keyframes beat{50%{transform:scale(1.15)}}button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:13px 24px;font-weight:750;transition:transform .2s,filter .2s}button:hover{transform:translateY(-2px);filter:brightness(1.04)}.primary{background:var(--site-primary);color:#fff;box-shadow:0 7px 18px #b52c6835}.secondary{background:light-dark(#f9e2eb,#593247);color:light-dark(#64213f,#ffeaf2)}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:28px;width:100%}.gift{width:150px;height:130px;position:relative;margin:18px auto 30px;cursor:pointer;animation:bob 2s infinite}.gift .box{position:absolute;bottom:0;width:150px;height:90px;background:#d83d7c;border-radius:9px;box-shadow:inset -10px 0 #b92b67}.gift .lid{position:absolute;top:24px;left:-8px;width:166px;height:27px;background:#f16ca0;border-radius:7px;transform-origin:left;transition:.65s}.gift .ribbon{position:absolute;left:62px;bottom:0;width:26px;height:90px;background:#ffe5a5}.gift .bow{position:absolute;top:0;left:56px;font-size:42px;color:#ffe5a5}.gift.open .lid{transform:translateY(-65px) rotate(-20deg)}@keyframes bob{50%{transform:translateY(-7px)}}
.chat{width:100%;max-width:470px;background:#f7f0f4;color:#34232d;border-radius:18px;padding:14px;text-align:left;margin:8px auto 22px;box-shadow:0 7px 20px #35102515}.chathead{display:flex;align-items:center;gap:10px;border-bottom:1px solid #e6dbe1;padding:5px 4px 12px;font-weight:800}.avatar{display:grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#f5c5da}.chatbody{padding:12px 2px 4px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:83%;padding:10px 13px;border-radius:16px;font-size:.91rem;line-height:1.45;animation:pop .4s both}.left{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}.right{align-self:flex-end;background:#f9c8df;border-bottom-right-radius:4px}.time{text-align:center;font-size:.72rem;color:#8a7581;margin:3px}.chatfoot{font-size:.74rem;color:#8a7581;border-top:1px solid #e6dbe1;padding-top:10px;text-align:center}@keyframes pop{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}.call{width:min(100%,360px);height:230px;border-radius:25px;background:linear-gradient(145deg,#6b3157,#26172f);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin:12px auto 24px;box-shadow:0 12px 30px #2e123c35}.call .avatar{width:75px;height:75px;font-size:2rem;background:#f8cfe0;color:#743052}.calltime{font-size:1.5rem;font-weight:800;letter-spacing:.06em}.callbtn{display:flex;gap:10px}.callbtn span{background:#ffffff20;border-radius:50%;padding:10px}.station{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:450px;margin:8px auto 24px;min-height:150px;background:linear-gradient(#fce5ed,#f9d0e0);border-radius:22px;color:#702b4c;position:relative;overflow:hidden}.person{font-size:55px;animation:arrive 2s infinite alternate}.scoot{font-size:48px;animation:roll 2.5s infinite alternate}.track{position:absolute;bottom:25px;left:0;right:0;border-bottom:3px dashed #d68aa9}@keyframes arrive{to{transform:translateX(10px)}}@keyframes roll{to{transform:translateX(-10px) rotate(-3deg)}}.note{font-size:.88rem;opacity:.75;margin-top:16px}.final-heart{font-size:clamp(75px,18vw,130px);position:relative;line-height:1.2;animation:beat 1s infinite}.heartwords{position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:clamp(12px,3vw,18px);font-weight:900;text-shadow:0 1px 4px #8c1949}.answer{min-height:50px;margin-top:16px;font-weight:800;color:var(--site-primary);line-height:1.7}.tiny{font-size:.8rem;opacity:.65;margin-top:18px}
@media(max-width:430px){main{padding:15px 12px 40px}.card{min-height:470px;padding:22px 17px}.sub{font-size:1rem}.chat{padding:10px}}
</style></head>
<body><div id="app"><div class="decor" id="decor"></div><main><header class="top"><div class="eyebrow">A little universe made for Nehu ♡</div><div class="progress"><span id="bar"></span></div></header><section class="card" id="page" aria-live="polite"></section></main></div>
<script>
const pages=[
{kind:'welcome',tag:'For my favourite person',title:'Nehu, this little surprise is for you…',body:'Two months of us. A thousand tiny memories. And a heart that keeps choosing you.',button:'Open your gift 🎁'},
{kind:'gift',tag:'A tiny gift, a huge feeling',title:'Happy Two Months of Togetherness, Baby!',body:'Two months down, and my favourite story is still being written—with you.',button:'Continue →'},
{kind:'youtube',tag:'Chapter 01 · The beginning',title:'From strangers to something special',body:'From a point where no one could have imagined a love story would start, we started ours. From being unknown to becoming friends… look at us now. 💗',button:'Continue →'},
{kind:'insta',tag:'Chapter 02 · A little closer',title:'You became my strength',body:'Our friendship journeyed from YouTube to Insta. Especially during exam times, you became my strength. Your presence mattered to me a lot, more than I could ever explain.',button:'Continue →'},
{kind:'call',tag:'Chapter 03 · 3:42 AM',title:'Six hours felt like minutes',body:'And then came those calls that made distance feel smaller. The day was 23 Aug. The time was 3:42 a.m. I asked you, “Neha Ganesh Kumbhare, will you be my girlfriend?” And you said, “Let’s see, let’s start.” And after that, our journey began—a journey full of joy, a journey full of love.',button:'Continue →'},
{kind:'together',tag:'Chapter 04 · Our little world',title:'We came a long way',body:'Spending time with each other, being each other’s emotional support, all those calls and video calls… every little moment became a part of us. And every moment with you is one I want to keep.',button:'Continue →'},
{kind:'station',tag:'Chapter 05 · 25 September',title:'The day I got to see you',body:'On 25 Sep, I came to meet you—and you made the biggest effort, skipping Ganesh Visarjan just to receive me. I was about to cry, but I stopped… varna bolti, “Kitna rondu BF mila hai!” 🥹💕',button:'Continue →'},
{kind:'hug',tag:'Chapter 06 · The goodbye',title:'One day together, a memory forever',body:'We spent almost a full day together, and had our first official date too. The next day I had to leave, your health got bad, and we had a fight. But still, Miss Kumbhare, you came to meet me. That showed me your efforts and your love. Honestly, I wanted that last hug to continue till the world ends… but I had to go, and our long-distance journey continued.',button:'Continue →'},
{kind:'distance',tag:'Chapter 07 · Still choosing us',title:'Not perfect, but ours',body:'We’ve had fights, and we’ve found ways to sort things out. Sometimes we can’t get enough time for each other. Still, the moments we do get are ours—and they mean the world to me. I don’t need every day to be perfect. I just want us to keep trying, understanding, and choosing each other.',button:'Continue →'},
{kind:'proposal',tag:'My favourite question',title:'Miss Neha Ganesh Kumbhare…',body:'Rishabh Ranjan wants to surrender the rest of his life to you, and turn these two months into infinity ♾️. Will you keep writing this story with me, baby?',button:'Choose with your heart'}
];
let current=0;const page=document.getElementById('page'),bar=document.getElementById('bar');
const heart=(n=18)=>'💗'.repeat(n);
function chat(title,items){return `<div class="chat"><div class="chathead"><div class="avatar">💬</div><div>${title}<div style="font-size:.72rem;color:#8a7581;font-weight:500">our little beginning</div></div></div><div class="chatbody">${items.map((x,i)=>`<div class="bubble ${i%2?'right':'left'}">${x}</div>`).join('')}</div><div class="chatfoot">a little memory, forever in our story ♡</div></div>`}
function render(){
bar.style.width=(current/(pages.length-1)*100)+'%';
const p=pages[current];let content='';
if(p.kind==='welcome')content=`<div class="heart">💗</div><div class="eyebrow">${p.tag}</div><h1>${p.title}</h1><p class="sub">${p.body}</p><div class="gift" id="gift"><div class="bow">🎀</div><div class="lid"></div><div class="box"><div class="ribbon"></div></div></div><div class="note">Tap the gift to start our little story</div><div class="actions"><button class="primary" id="next">${p.button}</button></div>`;
if(p.kind==='gift')content=`<div class="eyebrow">${p.tag}</div><div class="heart">🎁</div><h1>${p.title}</h1><p class="sub">${p.body}</p><div style="font-size:35px;margin:10px">🧸 💐 💌</div><div class="actions"><button class="primary" id="next">${p.button}</button></div>`;
if(p.kind==='youtube')content=`<div class="eyebrow">${p.tag}</div><h2>${p.title}</h2>${chat('YouTube · Nehu & Rishabh',['Hey, have you seen this? 😊','Haha yes! What about you?','You’re actually fun to talk to 😂','And just like that… strangers started becoming friends. 💗'])}<p class="sub">${p.body}</p><div class="actions"><button class="primary" id="next">${p.button}</button></div>`;
if(p.kind==='insta')content=`<div class="eyebrow">${p.tag}</div><h2>${p.title}</h2>${chat('Instagram · Nehu & Rishabh',['Exam stress is getting real 😭','You’ve got this. I believe in you. 💕','Talking to you makes everything feel lighter.','I’m here, okay? One step at a time. 🫶'])}<p class="sub">${p.body}</p><div class="actions"><button class="primary" id="next">${p.button}</button></div>`;
if(p.kind==='call')content=`<div class="eyebrow">${p.tag}</div><h2>${p.title}</h2><div class="call"><div class="avatar">🥰</div><div style="font-weight:800">Nehu ♡ Rishabh</div><div class="calltime">06:12:48</div><div class="callbtn"><span>🎙️</span><span>📹</span><span>💗</span></div><div style="font-size:.8rem;opacity:.8">the call neither of us wanted to end</div></div><p class="sub">${p.body}</p><div class="actions"><button class="primary" id="next">${p.button}</button></div>`;
if(p.kind==='together')content=`<div class="eyebrow">${p.tag}</div><div class="heart">📱💗</div><h2>${p.title}</h2><p class="sub">${p.body}</p><div style="font-size:38px;margin:16px">🫶 ☎️ 🌙</div><div class="actions"><button class="primary" id="next">${p.button}</button></div>`;
if(p.kind==='station')content=`<div class="eyebrow">${p.tag}</div><h2>${p.title}</h2><div class="station"><div class="track"></div><div class="person">🧍🏻‍♂️</div><div style="font-size:30px">💗</div><div class="person">👩🏻</div><div class="scoot">🛵</div></div><p class="sub">${p.body}</p><div class="actions"><button class="primary" id="next">${p.button}</button></div>`;
if(p.kind==='hug')content=`<div class="eyebrow">${p.tag}</div><div class="heart">🫂</div><h2>${p.title}</h2><p class="sub">${p.body}</p><div style="font-size:35px;margin:10px">🚉 💞 🌙</div><div class="actions"><button class="primary" id="next">${p.button}</button></div>`;
if(p.kind==='distance')content=`<div class="eyebrow">${p.tag}</div><div class="heart">🌍💞</div><h2>${p.title}</h2><p class="sub">${p.body}</p><div style="font-size:36px;margin:14px">🤝 💌 ♾️</div><div class="actions"><button class="primary" id="next">${p.button}</button></div>`;
if(p.kind==='proposal')content=`<div class="eyebrow">${p.tag}</div><div class="heart">💍</div><h2>${p.title}</h2><p class="sub">${p.body}</p><div class="actions"><button class="primary" id="yes">YES, MY LOVE 💖</button><button class="secondary" id="no">Not yet 🙈</button></div><div class="answer" id="answer"></div><div class="tiny">No pressure, just all my love. ♡</div>`;
page.innerHTML=content;
const next=document.getElementById('next');if(next)next.onclick=()=>{if(current===0){document.getElementById('gift')?.classList.add('open');setTimeout(()=>{current++;render()},450)}else{current++;render()}};
const gift=document.getElementById('gift');if(gift)gift.onclick=()=>{gift.classList.add('open');setTimeout(()=>{current++;render()},450)};
const yes=document.getElementById('yes');if(yes)yes.onclick=()=>{document.getElementById('answer').innerHTML='<div class="final-heart">❤️<span class="heartwords">Your Man<br>is Booked! 💍</span></div><p>Officially booked by Miss Neha Ganesh Kumbhare. Two months down, infinity to go. ♾️</p><div>💗 💗 💗</div>'};
const no=document.getElementById('no');if(no)no.onclick=()=>{document.getElementById('answer').innerHTML='It’s okay, baby. Your man will keep loving you and showing up for you. I hope one day this “No” can become a “Yes”—only when your heart is ready. 💗';};
}
const dec=document.getElementById('decor');for(let i=0;i<18;i++){const s=document.createElement('span');s.className='float';s.textContent=['♡','♥','✧','💗'][i%4];s.style.left=(i*5.7%100)+'%';s.style.animationDuration=(9+i%8)+'s';s.style.animationDelay=(-i%12)+'s';s.style.fontSize=(15+i%18)+'px';dec.appendChild(s)}render();
</script></body></html>
